<!-- navbar.component.html -->
<nav class="navbar" [class.scrolled]="isScrolled" [attr.aria-label]="ui().nav.menu">
  <div class="navbar-container">
    <!-- Left: Logo (always left-to-right, never translated or mirrored) -->
    <div class="navbar-logo">
      <a [routerLink]="langService.link('/')" class="logo-link" (click)="closeMobileMenu()">
        <span class="logo-text" dir="ltr">&lt; <span style="color: yellow;">Ka</span>/&gt;</span>
      </a>
    </div>

    <!-- Desktop Menu: Navigation + Contact + Social -->
    <div class="navbar-menu" [class.active]="isMobileMenuOpen">
      <!-- Navigation Links -->
      <div class="navbar-links">
        <ng-container *ngFor="let link of navLinks()">
          <a
            *ngIf="link.fragment"
            [href]="link.route + '#' + link.fragment"
            class="nav-link"
            (click)="scrollToSection($event, link.fragment)"
          >
            {{ link.label }}
          </a>
          <a
            *ngIf="!link.fragment"
            [routerLink]="link.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.route === '/' || link.route === '/ar/' }"
            ariaCurrentWhenActive="page"
            class="nav-link"
            (click)="closeMobileMenu()"
          >
            {{ link.label }}
          </a>
        </ng-container>

        <!-- Language switcher: the label is written in the language it switches to -->
        <a
          *ngIf="arabicLive"
          class="nav-link lang-switch"
          [routerLink]="switchLink()"
          [attr.hreflang]="otherLang()"
          [attr.lang]="otherLang()"
          (click)="closeMobileMenu()"
        >
          {{ ui().switchLabel }}
        </a>
      </div>

      <!-- Contact Info -->
      <div class="navbar-contact">
        <a [href]="contactInfo.emailUrl" class="contact-item ltr-text">
          {{ contactInfo.email }}
        </a>
        <a [href]="contactInfo.phoneUrl" class="contact-item ltr-text">
          {{ contactInfo.phone }}
        </a>
      </div>

      <!-- Social Icons -->
      <div class="navbar-social">
        <a 
          *ngFor="let social of socialLinks"
          [href]="social.url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="social.name"
          class="social-icon"
        >
          <i [class]="social.icon" aria-hidden="true"></i>
        </a>
      </div>
    </div>

    <!-- Mobile Menu Toggle (Hamburger) -->
    <button 
      class="mobile-toggle" 
      [class.active]="isMobileMenuOpen"
      (click)="toggleMobileMenu()"
      [attr.aria-label]="ui().nav.menu"
      [attr.aria-expanded]="isMobileMenuOpen"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</nav>
