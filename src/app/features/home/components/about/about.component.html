<section class="about-section d-flex align-items-center" id="about">
  <div class="container ">
    <div class="about-content">

      
      
      <div class="container">
        <div class="row align-items-center">
                    <div class="col-lg-6">
            <div #aboutContainer >
              <!-- <h2 class="section-title">About Section</h2> -->
               @if (langService.lang() === 'ar') {
                <h2 class="about-title">{{ ui().about.title }}</h2>
              } @else {
                <h2 class="about-title falling-text" appScrollTrigger>
                  @for (item of ui().about.title | fallingText:0.12:0:'words'; track $index) {<span [style.animation-delay.s]="item.delay">{{ item.char }}</span>{{ ' ' }}}
                </h2>
              }
              <!-- TODO: add the number of Shopify stores built (not provided yet) to the about text in core/i18n/ui.ts -->
              <p #aboutText class="about-text">{{ ui().about.text }}</p>
              <!-- <a href="#" class="btn btn-primary">Learn More</a> -->
            </div>
          </div>

          <div class="col-lg-6">
            <div class="about-image">
              <img ngSrc="assets/images/about/about-image.webp" [alt]="ui().about.imageAlt" class="img-fluid" width="1084" height="734" sizes="(min-width: 992px) 45vw, 100vw">
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
