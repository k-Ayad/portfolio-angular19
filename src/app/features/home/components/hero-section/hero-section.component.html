<section class="hero-section vh-100 d-flex align-items-center bg-black text-white pt-5">
    <div class="container text-center position-relative">
        <div class="image-container">
            <img ngSrc="assets/images/profile.webp" width="1197" height="986" priority sizes="(min-width: 1200px) 40vw, 100vw" alt="Portrait of Kerllos Ayad, Shopify developer and Senior Frontend Engineer in Cairo, Egypt">
            <div class="overlay"></div>
        </div>
        
        <div class="project-images-container py-5 mb-4">
            @for (skill of skillsImages; track skill.alt; let i = $index) {
                <div 
                    class="skill-image-wrapper position-absolute" 
                    [style.--desktop-top]="skill.desktopPosition.top"
                    [style.--desktop-left]="skill.desktopPosition.left"
                    [style.--mobile-top]="skill.mobilePosition.top"
                    [style.--mobile-left]="skill.mobilePosition.left"
                    [style.--desktop-width]="skill.desktopWidth"
                    [style.--mobile-width]="skill.mobileWidth"
                    (mouseenter)="onSkillHover(i)"
                    (mouseleave)="onSkillLeave(i)"
                >
                    <img 
                        [ngSrc]="skill.src" 
                        width="140"
                        height="140"
                        disableOptimizedSrcset
                        [alt]="skill.alt"
                        class="skill-icon opacity-50"
                        [class.scale-up]="skill.animationClass === 'scale-up'"
                        [class.scale-down]="skill.animationClass === 'scale-down'"
                    />
                </div>
            }
        </div>

        <div class="text-container">
            <!-- Main Heading -->
            <div class="name-wrapper position-absolute top-0 start-50 translate-middle-x d-flex align-items-center">
                <span class="arrow-left">&lt;</span>
                <h1 class="hero-name">Kerllos Ayad <span class="hero-subtitle">Shopify Developer in Cairo, Egypt</span></h1>
                <span class="arrow-right">/ &gt;</span>
            </div>
            <h2 class="hero-heading">
                Howdy! Meet Your Trusted<br>
                Frontend Developer<br>
                & Shopify Expert Partner,<br>
                Crafting Strong Web Apps<span class="dot">.</span>
            </h2>

            <div class="action-btns">
                <a routerLink="/portfolio" class="action-button mx-2 mb-2"><i class="fa-solid fa-display"></i> Show Projects</a>
                <button class="download-btn mx-2" (click)="downloadResume()">
                    <i class="fa-regular fa-file-zipper"></i> Download Resume
                </button>
            </div>

            <!-- Scroll Indicator -->
            <div class="scroll-indicator">
                <div class="mouse">
                    <div class="wheel"></div>
                </div>
            </div>
        </div>
    </div>
</section>
