<section class="projects-carousel-section">
  <div class="container">
    <!-- Section Title -->
    <div class="section-header">
      <h2 class="section-title text-center">{{ ui().projectsSection.title }}</h2>
      <p class="hero-intro text-center">{{ ui().projectsSection.intro }}</p>
    </div>

    <!-- Carousel Container -->
    <div 
      *ngIf="projects.length > 0"
      class="carousel-container"
      dir="ltr"
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()">
      
      <!-- Carousel Wrapper -->
      <div class="carousel-wrapper">
        <!-- Carousel Slides -->
        <div 
          *ngFor="let project of projects ;  let i = index "
          class="carousel-slide"
          [ngClass]="getSlideClass(i)"
          [attr.aria-hidden]="i !== currentIndex">
          
          <div class="slide-image-wrapper">
            <img 
              [ngSrc]="project.image" 
              [width]="imageSize(project.image).width"
              [height]="imageSize(project.image).height"
              sizes="(min-width: 769px) 60vw, 100vw"
              [alt]="screenshotAlt(project)"
              class="slide-image">
          </div>
        </div>
      </div>

      <!-- Navigation Controls -->
      <button 
        class="carousel-control prev"
        (click)="prev()"
        [attr.aria-label]="langService.lang() === 'ar' ? 'الشريحة السابقة' : 'Previous slide'">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button 
        class="carousel-control next"
        (click)="next()"
        [attr.aria-label]="langService.lang() === 'ar' ? 'الشريحة التالية' : 'Next slide'">
        <i class="fas fa-chevron-right"></i>
      </button>

      <!-- Carousel Indicators -->
      <div class="carousel-indicators">
        <button
          *ngFor="let project of projects; let i = index"
          class="indicator"
          [class.active]="i === currentIndex"
          (click)="goToSlide(i)"
          [attr.aria-label]="(langService.lang() === 'ar' ? 'الانتقال إلى الشريحة ' : 'Go to slide ') + (i + 1)"
          [attr.aria-current]="i === currentIndex ? 'true' : 'false'">
        </button>
      </div>
    </div>

    <!-- Active Project Details -->
    <div 
      *ngIf="activeProject" 
      class="project-details">
      <div class="details-content">
        <h2 class="project-title">{{ activeProject.title }}</h2>
        <p class="project-description">{{ activeSummary }}</p>
        
        <!-- Technologies -->
        <div *ngIf="activeProject.technologies" class="technologies">
          <span 
            *ngFor="let tech of activeProject.technologies" 
            class="tech-badge">
            {{ tech }}
          </span>
        </div>

        <a
          class="show-details-btn"
          [routerLink]="langService.link('/work/' + activeProject.slug)">
          <i class="fas fa-arrow-right flip-rtl" aria-hidden="true"></i>
          {{ ui().projectsSection.showDetails }}
        </a>
      </div>
    </div>

    <!-- Plain links to every project page -->
    <nav class="all-projects-nav" [attr.aria-label]="ui().projectsSection.allTitle">
      <h3 class="all-projects-title">{{ ui().projectsSection.allTitle }}</h3>
      <ul class="all-projects-list">
        <li *ngFor="let project of allProjects">
          <a [routerLink]="langService.link('/work/' + project.slug)">{{ project.title }}</a>
        </li>
      </ul>
    </nav>
  </div>
</section>
