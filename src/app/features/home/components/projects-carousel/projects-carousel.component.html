<section class="projects-carousel-section">
  <div class="container">
    <!-- Section Title -->
    <div class="section-header">
      <h2 class="section-title text-center">Projects</h2>
    </div>

    <!-- Carousel Container -->
    <div 
      *ngIf="projects.length > 0"
      class="carousel-container"
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()">
      
      <!-- Carousel Wrapper -->
      <div class="carousel-wrapper">
        <!-- Carousel Slides -->
        <div 
          *ngFor="let project of projects ;  let i = index "
          class="carousel-slide"
          [ngClass]="getSlideClass(i)"
          [attr.aria-hidden]="i !== currentIndex">
          
          <div class="slide-image-wrapper">
            <img 
              [src]="project.image" 
              [alt]="'Screenshot of the ' + project.title + ' website'"
              class="slide-image"
              [attr.loading]="i === 0 ? 'eager' : 'lazy'">
          </div>
        </div>
      </div>

      <!-- Navigation Controls -->
      <button 
        class="carousel-control prev"
        (click)="prev()"
        aria-label="Previous slide">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button 
        class="carousel-control next"
        (click)="next()"
        aria-label="Next slide">
        <i class="fas fa-chevron-right"></i>
      </button>

      <!-- Carousel Indicators -->
      <div class="carousel-indicators">
        <button
          *ngFor="let project of projects; let i = index"
          class="indicator"
          [class.active]="i === currentIndex"
          (click)="goToSlide(i)"
          [attr.aria-label]="'Go to slide ' + (i + 1)"
          [attr.aria-current]="i === currentIndex ? 'true' : 'false'">
        </button>
      </div>
    </div>

    <!-- Active Project Details -->
    <div 
      *ngIf="activeProject" 
      class="project-details">
      <div class="details-content">
        <h2 class="project-title">{{ activeProject.title }}</h2>
        <p class="project-description">{{ activeProject.summary }}</p>
        
        <!-- Technologies -->
        <div *ngIf="activeProject.technologies" class="technologies">
          <span 
            *ngFor="let tech of activeProject.technologies" 
            class="tech-badge">
            {{ tech }}
          </span>
        </div>

        <a
          class="show-details-btn"
          [routerLink]="['/work', activeProject.slug]">
          <i class="fas fa-arrow-right"></i>
          Show Details
        </a>
      </div>
    </div>

    <!-- Plain links to every project page -->
    <nav class="all-projects-nav" aria-label="All project pages">
      <h3 class="all-projects-title">All Shopify &amp; web projects</h3>
      <ul class="all-projects-list">
        <li *ngFor="let project of allProjects">
          <a [routerLink]="['/work', project.slug]">{{ project.title }}</a>
        </li>
      </ul>
    </nav>
  </div>
</section>
