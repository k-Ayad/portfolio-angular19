<section class="not-found">
  <h1 class="not-found-title">{{ ui().notFound.title }}</h1>
  <p class="not-found-text">{{ ui().notFound.text }}</p>
  <div class="not-found-links">
    <a [routerLink]="langService.link('/')" class="not-found-btn primary">{{ ui().notFound.home }}</a>
    <a [routerLink]="langService.link('/portfolio')" class="not-found-btn">{{ ui().notFound.projects }}</a>
  </div>
</section>
