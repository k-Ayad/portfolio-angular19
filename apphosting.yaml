# Firebase App Hosting runtime settings. Angular only answers requests for these hosts. App Hosting forwards
# requests to Cloud Run with the run.app Host header, so those addresses must stay in the list.
# Cloud Run also sends X-Forwarded-Proto; if it isn't trusted, Angular answers every URL with the home-page shell.
env:
  - variable: NG_ALLOWED_HOSTS
    value: my-portfolio-311278176382.europe-west4.run.app,my-portfolio-kmvupc7ucq-ez.a.run.app,my-portfolio--kerllos-portfolio.europe-west4.hosted.app,k-ayad.com,www.k-ayad.com
    availability:
      - RUNTIME
  - variable: NG_TRUST_PROXY_HEADERS
    value: X-Forwarded-Host,X-Forwarded-Proto
    availability:
      - RUNTIME
